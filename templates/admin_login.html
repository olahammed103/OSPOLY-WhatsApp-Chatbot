{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h2>Admin Login</h2>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" required placeholder="admin">
    <label>Password</label>
    <input type="password" name="password" required placeholder="••••••••">
    <button type="submit">Log In</button>
  </form>
</div>
{% endblock %}
